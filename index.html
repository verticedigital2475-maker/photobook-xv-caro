<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muestra de Photobook · Caro Mis XV</title>
  <!-- Librería Page-Flip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #26272b 0%, #111215 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      color: #fff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* HEADER SUPERIOR */
    header {
      width: 100%;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 19, 22, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 50;
    }
    .header-info {
      display: flex;
      flex-direction: column;
    }
    .brand-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f5f5f7;
    }
    .brand-subtitle {
      font-size: 0.75rem;
      color: #9aa0a6;
    }

    /* HERRAMIENTAS SUPERIORES */
    .top-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tool-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e4e7eb;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tool-btn:hover, .tool-btn.active {
      background: rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      border-color: #38bdf8;
    }
    .tool-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* MENSAJE INDICADOR DE ZOOM */
    #zoom-hint {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #e2e8f0;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      text-align: center;
      max-width: 90%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }
    #zoom-hint.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ÁREA DEL LIBRO */
    .book-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      perspective: 2200px;
      position: relative;
      overflow: hidden;
      touch-action: none; /* Control táctil nativo bajo JavaScript */
    }

    #flipbook-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #flipbook-container.zoomed {
      cursor: grab;
    }
    #flipbook-container.zoomed:active {
      cursor: grabbing;
    }

    #flipbook {
      display: none;
      position: relative;
      z-index: 10;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9);
    }
    .my-page {
      background-color: #151515;
      overflow: hidden;
    }
    .my-page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      -webkit-user-drag: none;
    }

    /* LOGOTIPO LATERAL EN EL FONDO (PC) */
    #brand-badge {
      position: absolute;
      left: 18%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 18px;
      text-decoration: none;
      color: #ffffff;
      opacity: 1;
      transition: opacity 0.4s ease, transform 0.2s ease;
    }
    #brand-badge:hover {
      transform: translate(-50%, -50%) scale(1.03);
    }
    #brand-badge img {
      height: 150px !important;
      width: 150px !important;
      object-fit: contain;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.85));
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.9);
    }
    .brand-text .sub {
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #cfcfcf;
      font-weight: 500;
    }
    .brand-text .main {
      font-size: 2.6rem;
      font-weight: 800;
      color: #ffffff;
    }

    /* FLECHAS FLOTANTES */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(20, 22, 26, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 40;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .nav-arrow:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%) scale(1.08);
    }
    .nav-arrow.left { left: 16px; }
    .nav-arrow.right { right: 16px; }
    .nav-arrow svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* BARRA INFERIOR */
    footer {
      width: 100%;
      padding: 10px 16px 14px;
      background: rgba(18, 19, 22, 0.7);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 50;
    }

    .progress-bar-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-track {
      flex: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      position: relative;
      cursor: pointer;
    }
    .slider-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 4px;
      width: 0%;
      transition: width 0.3s ease;
    }
    .page-counter {
      font-size: 0.8rem;
      color: #cbd5e1;
      font-weight: 500;
      min-width: 100px;
      text-align: center;
    }

    .bottom-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .btn-copy {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
    }
    .btn-approval {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .action-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    #toast {
      position: fixed;
      top: 65px;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      z-index: 100;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.25s ease;
      pointer-events: none;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 900px) {
      #brand-badge { display: none !important; }
      .nav-arrow { display: none; }
    }
  </style>
</head>
<body>

  <div id="toast">Enlace copiado al portapapeles</div>
  <div id="zoom-hint">🔍 Zoom activo · Arrastra para explorar · Quita el zoom para hojear</div>

  <!-- HEADER -->
  <header>
    <div class="header-info">
      <div class="brand-title">Muestra Digital de Photobook</div>
      <div class="brand-subtitle">Caro · Mis XV Años</div>
    </div>

    <div class="top-toolbar">
      <button class="tool-btn" id="btn-sound" title="Sonido">
        <svg id="icon-sound" viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>

      <button class="tool-btn" id="btn-zoom" title="Acercar detalles (2.5x)">
        <svg viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zm.5-7H9v2H7v1h2v2h1v-2h2V9h-2z"/>
        </svg>
      </button>

      <button class="tool-btn" id="btn-fullscreen" title="Pantalla completa">
        <svg viewBox="0 0 24 24">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- CONTENEDOR DEL LIBRO -->
  <div class="book-wrapper" id="wrapper">

    <button class="nav-arrow left" id="arrow-prev" title="Página anterior">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>

    <a id="brand-badge" href="https://wa.me/524424249172" target="_blank" title="Contactar por WhatsApp">
      <img src="logo.png" alt="Logo">
      <div class="brand-text">
        <span class="sub">Fotografía y Video</span>
        <span class="main">Corregidora</span>
      </div>
    </a>

    <div id="flipbook-container">
      <div id="flipbook"></div>
    </div>

    <button class="nav-arrow right" id="arrow-next" title="Página siguiente">
      <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>
  </div>

  <!-- BARRA INFERIOR -->
  <footer>
    <div class="progress-bar-container">
      <div class="page-counter" id="page-num">Portada</div>
      <div class="slider-track" id="slider-track">
        <div class="slider-fill" id="slider-fill"></div>
      </div>
    </div>

    <div class="bottom-actions">
      <button class="action-btn btn-copy" id="btn-share">
        <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
        <span>Copiar enlace</span>
      </button>

      <a class="action-btn btn-approval" href="https://wa.me/524424249172?text=Hola%20Cris%2C%20ya%20revise%20la%20muestra%20del%20photobook%20de%20Caro%20y%20tengo%20los%20siguientes%20comentarios%3A" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 2.17.7 4.19 1.9 5.86L2.6 22l4.3-1.25C8.42 21.49 10.15 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm-2 14.5l-4-4 1.41-1.41L10 13.67l6.59-6.59L18 8.5l-8 8z"/></svg>
        <span>Aprobar / Comentarios</span>
      </a>
    </div>
  </footer>

  <script>
    const imagenes = [
      "01_portada.jpg",
      "02_LIENZO_01_izq.jpg", "03_LIENZO_01_der.jpg",
      "04_LIENZO_02_izq.jpg", "05_LIENZO_02_der.jpg",
      "06_LIENZO_03_izq.jpg", "07_LIENZO_03_der.jpg",
      "08_LIENZO_04_izq.jpg", "09_LIENZO_04_der.jpg",
      "10_LIENZO_05_izq.jpg", "11_LIENZO_05_der.jpg",
      "12_LIENZO_06_izq.jpg", "13_LIENZO_06_der.jpg",
      "14_LIENZO_07_izq.jpg", "15_LIENZO_07_der.jpg",
      "16_LIENZO_08_izq.jpg", "17_LIENZO_08_der.jpg",
      "18_LIENZO_09_izq.jpg", "19_LIENZO_09_der.jpg",
      "20_LIENZO_10_izq.jpg", "21_LIENZO_10_der.jpg",
      "22_LIENZO_11_izq.jpg", "23_LIENZO_11_der.jpg",
      "24_LIENZO_12_izq.jpg", "25_LIENZO_12_der.jpg",
      "26_contraportada.jpg"
    ];

    const contenedor = document.getElementById("flipbook");
    const flipContainer = document.getElementById("flipbook-container");
    const wrapper = document.getElementById("wrapper");
    const brandBadge = document.getElementById("brand-badge");
    const numPaginaTxt = document.getElementById("page-num");
    const sliderFill = document.getElementById("slider-fill");
    const zoomHint = document.getElementById("zoom-hint");

    // Construcción de páginas con carga inteligente
    imagenes.forEach((src, index) => {
      const pageDiv = document.createElement("div");
      pageDiv.className = "my-page";
      pageDiv.setAttribute("data-density", "hard");

      const img = document.createElement("img");
      img.src = src;
      img.alt = `Página ${index + 1}`;
      if (index > 4) {
        img.loading = "lazy"; // Las páginas lejanas no saturan el inicio de la app
      }
      pageDiv.appendChild(img);
      contenedor.appendChild(pageDiv);
    });

    // CÁLCULO PRECISO PARA ENCAJAR PERFECTO EN CELULAR Y PC
    const anchoVentana = window.innerWidth;
    const altoVentana = window.innerHeight;

    // En celular dejamos margen limpio; el pliego completo ocupa el ancho disponible
    const maxAnchoLibro = anchoVentana * (anchoVentana < 768 ? 0.94 : 0.85);
    const maxAltoLibro = (altoVentana - 130) * 0.88;

    // Cada página mide la mitad del ancho total del libro
    let pageBaseSize = Math.floor(Math.min(maxAnchoLibro / 2, maxAltoLibro));
    pageBaseSize = Math.max(120, Math.min(520, pageBaseSize));

    // Inicializar PageFlip
    const pageFlip = new St.PageFlip(contenedor, {
      width: pageBaseSize,
      height: pageBaseSize,
      size: "stretch",
      minWidth: 100,
      maxWidth: 650,
      minHeight: 100,
      maxHeight: 650,
      showCover: true,
      flippingTime: 750,
      usePortrait: false,        // Siempre muestra el pliego panorámico completo
      startPage: 0,
      drawShadow: true,
      maxShadowOpacity: 0.7
    });

    pageFlip.loadFromHTML(document.querySelectorAll(".my-page"));
    contenedor.style.display = "block";

    // SISTEMA DE ZOOM SEGURO: BLOQUEA EL CAMBIO DE PÁGINAS MIENTRAS HAYA ZOOM
    let isZoomed = false;
    let currentScale = 1;
    let panX = 0, panY = 0;
    let startX = 0, startY = 0;
    let isDragging = false;

    function aplicarTransformacion() {
      if (isZoomed) {
        flipContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
      } else {
        flipContainer.style.transform = `translate(0px, 0px) scale(1)`;
      }
    }

    function toggleZoom() {
      isZoomed = !isZoomed;
      const btnZoom = document.getElementById("btn-zoom");

      if (isZoomed) {
        // En celular aplica 2.8x para máxima definición de rostros; en PC 2.2x
        currentScale = window.innerWidth < 768 ? 2.8 : 2.2;
        flipContainer.classList.add("zoomed");
        btnZoom.classList.add("active");
        zoomHint.classList.add("show");
        
        // ¡CLAVE! Desactiva los toques en el libro para que NUNCA cambie de página con zoom
        contenedor.style.pointerEvents = "none";
        panX = 0;
        panY = 0;
      } else {
        currentScale = 1;
        panX = 0;
        panY = 0;
        flipContainer.classList.remove("zoomed");
        btnZoom.classList.remove("active");
        zoomHint.classList.remove("show");

        // Reactiva el paso de páginas normal al quitar el zoom
        contenedor.style.pointerEvents = "auto";
      }
      aplicarTransformacion();
    }

    document.getElementById("btn-zoom").addEventListener("click", toggleZoom);

    // Doble toque rápido para entrar/salir de zoom
    let lastTap = 0;
    wrapper.addEventListener("touchend", (e) => {
      const now = new Date().getTime();
      if (now - lastTap < 300 && now - lastTap > 0) {
        toggleZoom();
        e.preventDefault();
      }
      lastTap = now;
    });

    // ARRASTRE DE ZOOM (RATÓN Y DEDO)
    function onStart(x, y) {
      if (!isZoomed) return;
      isDragging = true;
      startX = x - panX;
      startY = y - panY;
    }

    function onMove(x, y) {
      if (!isDragging || !isZoomed) return;
      panX = x - startX;
      panY = y - startY;
      aplicarTransformacion();
    }

    function onEnd() {
      isDragging = false;
    }

    // Eventos Mouse
    wrapper.addEventListener("mousedown", (e) => onStart(e.clientX, e.clientY));
    window.addEventListener("mousemove", (e) => onMove(e.clientX, e.clientY));
    window.addEventListener("mouseup", onEnd);

    // Eventos Táctiles Móvil
    wrapper.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) onStart(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    wrapper.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1 && isZoomed) {
        onMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    wrapper.addEventListener("touchend", onEnd);

    // SONIDO AL PASAR PÁGINA
    let audioActivo = true;
    let audioCtx = null;

    function reproducirSonidoHoja() {
      if (!audioActivo) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const bufferSize = audioCtx.sampleRate * 0.20;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 1100;
        filter.Q.value = 1.2;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.20);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } catch (e) {}
    }

    // ESTADO Y NAVEGACIÓN
    function actualizarVista(indice) {
      if (indice === 0) {
        brandBadge.style.opacity = "1";
        brandBadge.style.pointerEvents = "auto";
      } else {
        brandBadge.style.opacity = "0";
        brandBadge.style.pointerEvents = "none";
      }

      if (indice === 0) {
        numPaginaTxt.innerText = "Portada";
      } else if (indice >= imagenes.length - 1) {
        numPaginaTxt.innerText = "Contraportada";
      } else {
        numPaginaTxt.innerText = `Páginas ${indice} - ${indice + 1}`;
      }

      const porcentaje = (indice / (imagenes.length - 1)) * 100;
      sliderFill.style.width = `${porcentaje}%`;

      if (isZoomed) toggleZoom();
    }

    actualizarVista(0);

    pageFlip.on("flip", (e) => {
      reproducirSonidoHoja();
      actualizarVista(e.data);
    });

    document.getElementById("arrow-prev").addEventListener("click", () => pageFlip.flipPrev());
    document.getElementById("arrow-next").addEventListener("click", () => pageFlip.flipNext());

    const btnFullscreen = document.getElementById("btn-fullscreen");
    btnFullscreen.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    const btnSound = document.getElementById("btn-sound");
    const iconSound = document.getElementById("icon-sound");
    btnSound.addEventListener("click", () => {
      audioActivo = !audioActivo;
      if (audioActivo) {
        iconSound.innerHTML = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;
        reproducirSonidoHoja();
      } else {
        iconSound.innerHTML = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;
      }
    });

    const btnShare = document.getElementById("btn-share");
    const toast = document.getElementById("toast");
    btnShare.addEventListener("click", () => {
      navigator.clipboard.writeText(window.location.href).then(() => {
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2200);
      });
    });

    const sliderTrack = document.getElementById("slider-track");
    sliderTrack.addEventListener("click", (e) => {
      const rect = sliderTrack.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      const targetPage = Math.round(ratio * (imagenes.length - 1));
      pageFlip.flip(targetPage);
    });
  </script>
