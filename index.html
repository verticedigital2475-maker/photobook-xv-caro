<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muestra de Photobook · Caro Mis XV</title>
  <!-- Librería Page-Flip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #26272b 0%, #111215 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      color: #fff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* HEADER */
    header {
      width: 100%;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 19, 22, 0.75);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 50;
      flex-shrink: 0;
    }
    .header-info {
      display: flex;
      flex-direction: column;
    }
    .brand-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f5f5f7;
    }
    .brand-subtitle {
      font-size: 0.8rem;
      color: #9aa0a6;
    }

    /* HERRAMIENTAS SUPERIORES */
    .top-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tool-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e4e7eb;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .tool-btn:hover, .tool-btn.active {
      background: rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      border-color: #38bdf8;
    }
    .tool-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .zoom-level-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #38bdf8;
      color: #0f172a;
      font-size: 0.65rem;
      font-weight: 800;
      border-radius: 10px;
      padding: 2px 5px;
      display: none;
    }

    /* GLOBO AZUL DE AVISO DE ZOOM */
    #zoom-hint {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%) translateY(-15px);
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #38bdf8;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 28px;
      font-size: 0.92rem;
      font-weight: 600;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 0 0 15px rgba(56, 189, 248, 0.25);
      cursor: pointer;
    }
    #zoom-hint.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    #zoom-hint .close-tag {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 0.75rem;
      margin-left: 6px;
    }

    /* ÁREA PRINCIPAL */
    .book-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2200px;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    #flipbook-container {
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.05s linear;
      will-change: transform;
    }
    #flipbook-container.zoomed {
      cursor: grab;
    }
    #flipbook-container.zoomed:active {
      cursor: grabbing;
    }

    #flipbook {
      position: relative;
      z-index: 10;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9);
    }
    .my-page {
      background-color: #151515;
      overflow: hidden;
    }
    .my-page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      -webkit-user-drag: none;
    }

    /* LOGOTIPO VERTICAL (LOGO ARRIBA + TEXTO EN 2 LÍNEAS ABAJO) */
    #brand-badge {
      position: absolute;
      left: 18%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      text-decoration: none;
      color: #ffffff;
      opacity: 1;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #brand-badge:hover {
      transform: translate(-50%, -50%) scale(1.03);
    }
    #brand-badge img {
      height: 140px !important;
      width: 140px !important;
      object-fit: contain;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.85));
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.15;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.9);
    }
    .brand-text .sub {
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #d1d5db;
      font-weight: 500;
    }
    .brand-text .main {
      font-size: 2.4rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    /* FORMATO VERTICAL PARA CELULAR Y TABLETA (ARRIBA DEL ÁLBUM, PROMINENTE) */
    @media (max-width: 900px) and (orientation: portrait) {
      #brand-badge {
        left: 50%;
        top: 25px;
        transform: translateX(-50%);
        gap: 10px;
        z-index: 15;
      }
      #brand-badge:hover {
        transform: translateX(-50%);
      }
      #brand-badge img {
        height: 100px !important;    /* Tamaño grande (2.5x mayor que antes) */
        width: 100px !important;
      }
      .brand-text .sub {
        font-size: 0.85rem;
        letter-spacing: 1.5px;
      }
      .brand-text .main {
        font-size: 1.6rem;
      }
      .nav-arrow {
        display: none;
      }
      #zoom-hint {
        width: 92%;
        font-size: 0.82rem;
        padding: 9px 14px;
        top: 155px; /* Se sitúa por debajo del encabezado de la marca */
      }
    }

    /* TABLETA GRANDE EN VERTICAL */
    @media (min-width: 600px) and (max-width: 1024px) and (orientation: portrait) {
      #brand-badge img {
        height: 125px !important;
        width: 125px !important;
      }
      .brand-text .sub {
        font-size: 1rem;
      }
      .brand-text .main {
        font-size: 2rem;
      }
    }

    /* CELULAR EN HORIZONTAL (OCULTO PARA MAXIMIZAR EL LIENZO) */
    @media (max-width: 900px) and (orientation: landscape) {
      #brand-badge {
        display: none !important;
      }
      .nav-arrow {
        display: none;
      }
    }

    /* FLECHAS */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(20, 22, 26, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 40;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .nav-arrow:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%) scale(1.08);
    }
    .nav-arrow.left { left: 16px; }
    .nav-arrow.right { right: 16px; }
    .nav-arrow svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* FOOTER */
    footer {
      width: 100%;
      padding: 10px 16px 14px;
      background: rgba(18, 19, 22, 0.7);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 50;
      flex-shrink: 0;
    }
    .progress-bar-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-track {
      flex: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      position: relative;
      cursor: pointer;
    }
    .slider-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 4px;
      width: 0%;
      transition: width 0.3s ease;
    }
    .page-counter {
      font-size: 0.8rem;
      color: #cbd5e1;
      font-weight: 500;
      min-width: 100px;
      text-align: center;
    }
    .bottom-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .btn-copy {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
    }
    .btn-approval {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .action-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    #toast {
      position: fixed;
      top: 65px;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      z-index: 100;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.25s ease;
      pointer-events: none;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div id="toast">Enlace copiado al portapapeles</div>
  
  <div id="zoom-hint">
    <span id="zoom-hint-text">🔍 Zoom 1/5 · Arrastra para explorar</span>
    <span class="close-tag">Toca para salir</span>
  </div>

  <!-- HEADER -->
  <header>
    <div class="header-info">
      <div class="brand-title">Muestra Digital de Photobook</div>
      <div class="brand-subtitle">Caro · Mis XV Años</div>
    </div>

    <div class="top-toolbar">
      <button class="tool-btn" id="btn-sound" title="Sonido">
        <svg id="icon-sound" viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>

      <button class="tool-btn" id="btn-zoom" title="Zoom en 6 pasos">
        <svg viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zm.5-7H9v2H7v1h2v2h1v-2h2V9h-2z"/>
        </svg>
        <span class="zoom-level-badge" id="zoom-badge">1</span>
      </button>

      <button class="tool-btn" id="btn-fullscreen" title="Pantalla completa">
        <svg viewBox="0 0 24 24">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- CONTENEDOR DEL LIBRO -->
  <div class="book-wrapper" id="wrapper">

    <button class="nav-arrow left" id="arrow-prev" title="Página anterior">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>

    <!-- LOGOTIPO: FORMATO VERTICAL CON RESPALDO AUTOMÁTICO DE EXTENSIÓN -->
    <a id="brand-badge" href="https://wa.me/524424249172" target="_blank" title="Contactar por WhatsApp">
      <img src="logo.png" alt="Logo" onerror="if(!this.dataset.tried){this.dataset.tried='1'; this.src='logo.jpg';} else if(this.dataset.tried==='1'){this.dataset.tried='2'; this.src='logo.jpeg';}">
      <div class="brand-text">
        <span class="sub">Foto y Video</span>
        <span class="main">Corregidora</span>
      </div>
    </a>

    <div id="flipbook-container">
      <div id="flipbook"></div>
    </div>

    <button class="nav-arrow right" id="arrow-next" title="Página siguiente">
      <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>
  </div>

  <!-- BARRA INFERIOR -->
  <footer>
    <div class="progress-bar-container">
      <div class="page-counter" id="page-num">Portada</div>
      <div class="slider-track" id="slider-track">
        <div class="slider-fill" id="slider-fill"></div>
      </div>
    </div>

    <div class="bottom-actions">
      <button class="action-btn btn-copy" id="btn-share">
        <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
        <span>Copiar enlace</span>
      </button>

      <a class="action-btn btn-approval" href="https://wa.me/524424249172?text=Hola%20Cris%2C%20ya%20revise%20la%20muestra%20del%20photobook%20de%20Caro%20y%20tengo%20los%20siguientes%20comentarios%3A" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 2.17.7 4.19 1.9 5.86L2.6 22l4.3-1.25C8.42 21.49 10.15 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 22zm-2 14.5l-4-4 1.41-1.41L10 13.67l6.59-6.59L18 8.5l-8 8z"/></svg>
        <span>Aprobar / Comentarios</span>
      </a>
    </div>
  </footer>

  <script>
    const imagenes = [
      "01_portada.jpg",
      "02_LIENZO_01_izq.jpg", "03_LIENZO_01_der.jpg",
      "04_LIENZO_02_izq.jpg", "05_LIENZO_02_der.jpg",
      "06_LIENZO_03_izq.jpg", "07_LIENZO_03_der.jpg",
      "08_LIENZO_04_izq.jpg", "09_LIENZO_04_der.jpg",
      "10_LIENZO_05_izq.jpg", "11_LIENZO_05_der.jpg",
      "12_LIENZO_06_izq.jpg", "13_LIENZO_06_der.jpg",
      "14_LIENZO_07_izq.jpg", "15_LIENZO_07_der.jpg",
      "16_LIENZO_08_izq.jpg", "17_LIENZO_08_der.jpg",
      "18_LIENZO_09_izq.jpg", "19_LIENZO_09_der.jpg",
      "20_LIENZO_10_izq.jpg", "21_LIENZO_10_der.jpg",
      "22_LIENZO_11_izq.jpg", "23_LIENZO_11_der.jpg",
      "24_LIENZO_12_izq.jpg", "25_LIENZO_12_der.jpg",
      "26_contraportada.jpg"
    ];

    const contenedor = document.getElementById("flipbook");
    const flipContainer = document.getElementById("flipbook-container");
    const wrapper = document.getElementById("wrapper");
    const brandBadge = document.getElementById("brand-badge");
    const numPaginaTxt = document.getElementById("page-num");
    const sliderFill = document.getElementById("slider-fill");
    const zoomHint = document.getElementById("zoom-hint");
    const zoomHintText = document.getElementById("zoom-hint-text");
    const btnZoom = document.getElementById("btn-zoom");
    const zoomBadge = document.getElementById("zoom-badge");

    let paginaActual = 0;

    // Construcción de páginas
    imagenes.forEach((src, index) => {
      const pageDiv = document.createElement("div");
      pageDiv.className = "my-page";
      pageDiv.setAttribute("data-density", "hard");

      const img = document.createElement("img");
      img.src = src;
      img.alt = `Página ${index + 1}`;
      if (index > 4) img.loading = "lazy";
      pageDiv.appendChild(img);
      contenedor.appendChild(pageDiv);
    });

    // Medidas precisas
    const anchoVentana = window.innerWidth;
    const altoVentana = window.innerHeight;
    const maxAnchoLibro = anchoVentana * (anchoVentana < 768 ? 0.94 : 0.85);
    const maxAltoLibro = Math.max(260, altoVentana - 150);

    let pageBaseSize = Math.floor(Math.min(maxAnchoLibro / 2, maxAltoLibro * 0.75));
    pageBaseSize = Math.max(160, Math.min(520, pageBaseSize));

    // Inicializar St.PageFlip
    const pageFlip = new St.PageFlip(contenedor, {
      width: pageBaseSize,
      height: pageBaseSize,
      size: "fixed",
      minWidth: 140,
      maxWidth: 650,
      minHeight: 140,
      maxHeight: 650,
      showCover: true,
      flippingTime: 750,
      usePortrait: false,
      startPage: 0,
      drawShadow: true,
      maxShadowOpacity: 0.7
    });

    pageFlip.loadFromHTML(document.querySelectorAll(".my-page"));

    // ================================================================
    // MOTOR DE ZOOM AVANZADO
    // ================================================================
    const ZOOM_STEPS = [1.0, 1.6, 2.3, 3.1, 4.2, 5.5];
    let currentStepIndex = 0;
    let currentScale = 1.0;
    let panX = 0, panY = 0;

    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;

    let isPinching = false;
    let pinchStartDist = 0;
    let pinchStartScale = 1.0;

    function renderTransform() {
      flipContainer.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${currentScale})`;
    }

    function actualizarVisibilidadLogo() {
      if (!brandBadge) return;
      const isZoomed = currentScale > 1.08;
      const isMobilePortrait = window.innerWidth <= 900 && window.innerHeight > window.innerWidth;

      if (isZoomed) {
        brandBadge.style.opacity = "0";
        brandBadge.style.pointerEvents = "none";
        return;
      }

      if (isMobilePortrait) {
        brandBadge.style.opacity = "1";
        brandBadge.style.pointerEvents = "auto";
      } else {
        if (paginaActual === 0) {
          brandBadge.style.opacity = "1";
          brandBadge.style.pointerEvents = "auto";
        } else {
          brandBadge.style.opacity = "0";
          brandBadge.style.pointerEvents = "none";
        }
      }
    }

    function syncZoomUI() {
      const isZoomed = currentScale > 1.08;

      if (isZoomed) {
        flipContainer.classList.add("zoomed");
        btnZoom.classList.add("active");
        contenedor.style.pointerEvents = "none";

        let displayStep = currentStepIndex;
        if (displayStep === 0) {
          displayStep = Math.min(5, Math.max(1, Math.round((currentScale - 1) / 0.9)));
        }

        zoomBadge.style.display = "block";
        zoomBadge.innerText = displayStep;
        zoomHintText.innerText = `🔍 Zoom ${displayStep}/5 (${currentScale.toFixed(1)}x) · Arrastra`;
        zoomHint.classList.add("show");
      } else {
        currentScale = 1.0;
        currentStepIndex = 0;
        panX = 0;
        panY = 0;
        flipContainer.classList.remove("zoomed");
        btnZoom.classList.remove("active");
        zoomBadge.style.display = "none";
        zoomHint.classList.remove("show");
        contenedor.style.pointerEvents = "auto";
      }

      actualizarVisibilidadLogo();
      renderTransform();
    }

    btnZoom.addEventListener("click", () => {
      currentStepIndex = (currentStepIndex + 1) % ZOOM_STEPS.length;
      currentScale = ZOOM_STEPS[currentStepIndex];
      if (currentStepIndex === 0) {
        panX = 0;
        panY = 0;
      }
      syncZoomUI();
    });

    zoomHint.addEventListener("click", () => {
      currentStepIndex = 0;
      currentScale = 1.0;
      syncZoomUI();
    });

    // PELLIZCO Y ARRASTRE TÁCTIL
    function getDistance(t1, t2) {
      return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }

    wrapper.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        isPinching = true;
        isDragging = false;
        pinchStartDist = getDistance(e.touches[0], e.touches[1]);
        pinchStartScale = currentScale;
        contenedor.style.pointerEvents = "none";
        e.preventDefault();
      } else if (e.touches.length === 1 && currentScale > 1.08) {
        isDragging = true;
        dragStartX = e.touches[0].clientX - panX;
        dragStartY = e.touches[0].clientY - panY;
      }
    }, { passive: false });

    wrapper.addEventListener("touchmove", (e) => {
      if (isPinching && e.touches.length === 2) {
        const currentDist = getDistance(e.touches[0], e.touches[1]);
        const factor = currentDist / pinchStartDist;
        currentScale = Math.min(5.8, Math.max(1.0, pinchStartScale * factor));
        currentStepIndex = ZOOM_STEPS.findIndex(s => s >= currentScale);
        if (currentStepIndex === -1) currentStepIndex = 5;

        syncZoomUI();
        e.preventDefault();
      } else if (isDragging && e.touches.length === 1 && currentScale > 1.08) {
        panX = e.touches[0].clientX - dragStartX;
        panY = e.touches[0].clientY - dragStartY;
        renderTransform();
        e.preventDefault();
      }
    }, { passive: false });

    wrapper.addEventListener("touchend", (e) => {
      if (isPinching && e.touches.length < 2) {
        isPinching = false;
        if (currentScale <= 1.15) {
          currentScale = 1.0;
          currentStepIndex = 0;
          syncZoomUI();
        }
      }
      if (e.touches.length === 0) {
        isDragging = false;
      }
    });

    // RATÓN PC
    wrapper.addEventListener("mousedown", (e) => {
      if (currentScale > 1.08) {
        isDragging = true;
        dragStartX = e.clientX - panX;
        dragStartY = e.clientY - panY;
      }
    });

    window.addEventListener("mousemove", (e) => {
      if (isDragging && currentScale > 1.08) {
        panX = e.clientX - dragStartX;
        panY = e.clientY - dragStartY;
        renderTransform();
      }
    });

    window.addEventListener("mouseup", () => { isDragging = false; });

    // SONIDO
    let audioActivo = true;
    let audioCtx = null;

    function reproducirSonidoHoja() {
      if (!audioActivo) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const bufferSize = audioCtx.sampleRate * 0.20;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 1100;
        filter.Q.value = 1.2;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.20);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } catch (e) {}
    }

    // NAVEGACIÓN Y ESTADO
    function actualizarVista(indice) {
      paginaActual = indice;

      if (numPaginaTxt) {
        if (indice === 0) {
          numPaginaTxt.innerText = "Portada";
        } else if (indice >= imagenes.length - 1) {
          numPaginaTxt.innerText = "Contraportada";
        } else {
          numPaginaTxt.innerText = `Páginas ${indice} - ${indice + 1}`;
        }
      }

      if (sliderFill) {
        const porcentaje = (indice / (imagenes.length - 1)) * 100;
        sliderFill.style.width = `${porcentaje}%`;
      }

      if (currentScale > 1.0) {
        currentScale = 1.0;
        currentStepIndex = 0;
        syncZoomUI();
      } else {
        actualizarVisibilidadLogo();
      }
    }

    actualizarVista(0);

    pageFlip.on("flip", (e) => {
      reproducirSonidoHoja();
      actualizarVista(e.data);
    });

    const arrowPrev = document.getElementById("arrow-prev");
    const arrowNext = document.getElementById("arrow-next");
    if (arrowPrev) arrowPrev.addEventListener("click", () => pageFlip.flipPrev());
    if (arrowNext) arrowNext.addEventListener("click", () => pageFlip.flipNext());

    const btnFullscreen = document.getElementById("btn-fullscreen");
    if (btnFullscreen) {
      btnFullscreen.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });
    }

    const btnSound = document.getElementById("btn-sound");
    const iconSound = document.getElementById("icon-sound");
    if (btnSound && iconSound) {
      btnSound.addEventListener("click", () => {
        audioActivo = !audioActivo;
        if (audioActivo) {
          iconSound.innerHTML = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;
          reproducirSonidoHoja();
        } else {
          iconSound.innerHTML = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;
        }
      });
    }

    const btnShare = document.getElementById("btn-share");
    const toast = document.getElementById("toast");
    if (btnShare && toast) {
      btnShare.addEventListener("click", () => {
        navigator.clipboard.writeText(window.location.href).then(() => {
          toast.classList.add("show");
          setTimeout(() => toast.classList.remove("show"), 2200);
        });
      });
    }

    const sliderTrack = document.getElementById("slider-track");
    if (sliderTrack) {
      sliderTrack.addEventListener("click", (e) => {
        const rect = sliderTrack.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, clickX / rect.width));
        const targetPage = Math.round(ratio * (imagenes.length - 1));
        pageFlip.flip(targetPage);
      });
    }

    window.addEventListener("resize", actualizarVisibilidadLogo);
    window.addEventListener("orientationchange", () => setTimeout(actualizarVisibilidadLogo, 200));
  </script>
</body>
</html>
